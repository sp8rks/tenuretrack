# Example 1: the maintainer's own record. Past year 6, so the through-year-6
# benchmark applies directly. Run `tenuretrack init` to fill the ORCID-derived
# fields and confirm the topic set before `run`.

subject:
  name: "Taylor Sparks"
  orcid: "FILL_ME"                       # init resolves this; verify it is the right profile
  openalex_author_ids: []
  institution_ror: "https://ror.org/03r0ha626"   # University of Utah (verify with init)
  institution_name: "University of Utah"
  start_year: 2013
  clock_notes: "Assistant Professor, Materials Science and Engineering, from 2013."

subfield:
  label: "thermoelectrics and materials informatics"
  topics: []                             # init proposes these from 2013-2018 Utah bylines; edit before run
  excluded_topics: []

cohort:
  start_window: [2008, 2018]
  horizon_years: 6
  countries: ["US"]
  institution_types: ["education"]
  core_topic_share_min: 0.4
  min_led_papers: 3
  min_cell_size: 5
  bootstrap_iterations: 2000
  article_types: ["article"]

output:
  dir: examples/taylor-sparks/results
  slides: true
  chaperone: true
