[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenuretrack"
version = "0.1.0"
description = "Subfield publication norms for the tenure clock, computed from OpenAlex. Aggregates only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6",
  "pandas>=2.2",
  "numpy>=1.26",
  "python-pptx>=0.6.23",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
tenuretrack = "tenuretrack.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The logo is drawn onto the report cover and the deck. Colab installs this
# package from GitHub, so the file has to travel in the wheel.
[tool.setuptools.package-data]
tenuretrack = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
